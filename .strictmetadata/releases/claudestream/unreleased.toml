# The next release of claudestream. Fill in bump and description, then run `rlsbl release run --watch`.
format_version = 2
# How the release moves the version: patch, minor, major, or infra (moved as a patch, recorded as infra).
bump = "minor"
# What this release is, in a sentence or two. Required.
description = "claudestream rewritten in Go: a library of typed Claude Code events with sessions started through claudewheel profile exec, strict TOML agent definitions, and a command line installed with go install or from the release archives. The Python package is no longer published; PyPI and npm keep 0.15.3."
# Why these changes were made. Optional.
context = "The stricttools projects are moving to Go; the Python and npm releases stop at 0.15.3."
# The targets released, and the ones left out; between them they name every target of the releasable's members.
include = ["go"]
exclude = []
